---
# Rulebook: cisco_webhook_vlan.yml
#
# Trigger: HTTP POST to EDA webhook endpoint
# Action:  Provision or remove a VLAN on target NXOS switch
#
# Test with curl:
#   curl -X POST http://<eda-host>:5000/endpoint \
#     -H "Content-Type: application/json" \
#     -d '{"action":"create","vlan_id":"100","vlan_name":"PROD_SERVERS","switch":"nxos-sw-01"}'
#
# Supported actions: create, delete, update

- name: Cisco VLAN self-service provisioning via webhook
  hosts: all
  sources:
    - name: Listen for webhook events
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000          # EDA webhook port
        # token: "mysecrettoken"   # Uncomment to require auth token

  rules:

    # -----------------------------------------------------------------------
    # Rule 1: Create a new VLAN
    # POST body: {"action":"create","vlan_id":"100","vlan_name":"PROD_SERVERS","switch":"nxos-sw-01"}
    # -----------------------------------------------------------------------
    - name: Webhook - Create VLAN on NXOS
      condition: >
        event.payload.action == "create"
        and event.payload.vlan_id is defined
        and event.payload.switch is defined
      action:
        run_playbook:
          name: playbooks/provision_nxos_vlan.yml
          extra_vars:
            vlan_action: "create"
            vlan_id: "{{ event.payload.vlan_id }}"
            vlan_name: "{{ event.payload.vlan_name | default('VLAN_' + event.payload.vlan_id) }}"
            target_switch: "{{ event.payload.switch }}"
            requested_by: "{{ event.payload.requested_by | default('webhook') }}"

    # -----------------------------------------------------------------------
    # Rule 2: Remove an existing VLAN
    # POST body: {"action":"delete","vlan_id":"100","switch":"nxos-sw-01"}
    # -----------------------------------------------------------------------
    - name: Webhook - Delete VLAN on NXOS
      condition: >
        event.payload.action == "delete"
        and event.payload.vlan_id is defined
        and event.payload.switch is defined
      action:
        run_playbook:
          name: playbooks/provision_nxos_vlan.yml
          extra_vars:
            vlan_action: "delete"
            vlan_id: "{{ event.payload.vlan_id }}"
            target_switch: "{{ event.payload.switch }}"
            requested_by: "{{ event.payload.requested_by | default('webhook') }}"

    # -----------------------------------------------------------------------
    # Rule 3: Bulk IOS interface compliance check
    # POST body: {"action":"compliance_check","target_group":"cisco_ios"}
    # -----------------------------------------------------------------------
    - name: Webhook - Run compliance check
      condition: event.payload.action == "compliance_check"
      action:
        run_playbook:
          name: playbooks/compliance_check.yml
          extra_vars:
            target_group: "{{ event.payload.target_group | default('all') }}"
            requested_by: "{{ event.payload.requested_by | default('webhook') }}"
