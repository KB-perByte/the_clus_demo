---
# Rulebook: cisco_interface_remediation.yml
#
# Trigger: Syslog message from IOS/NXOS indicating interface state change
# Action:  Run playbook to restore interface and notify team
#
# Event source: ansible.eda.syslog
# Listens on UDP 514 — ensure firewall allows traffic from devices to EDA host
#
# Required collections:
#   ansible-galaxy collection install ansible.eda cisco.ios cisco.nxos

- name: Cisco interface down auto-remediation
  hosts: all
  sources:
    - name: Listen for IOS/NXOS syslog
      ansible.eda.syslog:
        host: 0.0.0.0      # Listen on all interfaces
        port: 514           # Standard syslog UDP port (use 1514 if running non-root)

  rules:

    # -----------------------------------------------------------------------
    # Rule 1: IOS interface went down
    # Matches: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down
    # -----------------------------------------------------------------------
    - name: IOS - Interface link down
      condition: >
        event.message is match(".*%LINK-3-UPDOWN.*changed state to down.*", ignorecase=true)
        or
        event.message is match(".*%LINEPROTO-5-UPDOWN.*line protocol.*down.*", ignorecase=true)
      action:
        run_playbook:
          name: playbooks/remediate_ios_interface.yml
          extra_vars:
            syslog_host: "{{ event.host }}"
            syslog_message: "{{ event.message }}"
            trigger_source: "syslog_ios_link_down"

    # -----------------------------------------------------------------------
    # Rule 2: NXOS interface went down
    # Matches: %ETH_PORT_CHANNEL-5-FOP_CHANGED or %IF_DOWN_ADMIN_DOWN
    # -----------------------------------------------------------------------
    - name: NXOS - Interface link down
      condition: >
        event.message is match(".*%ETHPORT-5-IF_DOWN_LINK_FAILURE.*", ignorecase=true)
        or
        event.message is match(".*%ETHPORT-5-IF_DOWN_NONE.*", ignorecase=true)
      action:
        run_playbook:
          name: playbooks/remediate_nxos_interface.yml
          extra_vars:
            syslog_host: "{{ event.host }}"
            syslog_message: "{{ event.message }}"
            trigger_source: "syslog_nxos_link_down"

    # -----------------------------------------------------------------------
    # Rule 3: Config change detected — trigger backup
    # Matches: %SYS-5-CONFIG_I: Configured from console by admin
    # -----------------------------------------------------------------------
    - name: IOS - Config change detected
      condition: >
        event.message is match(".*%SYS-5-CONFIG_I.*", ignorecase=true)
        or
        event.message is match(".*%PARSER-5-CFGLOG_LOGGEDCMD.*", ignorecase=true)
      action:
        run_playbook:
          name: playbooks/backup_config.yml
          extra_vars:
            syslog_host: "{{ event.host }}"
            syslog_message: "{{ event.message }}"
            trigger_source: "syslog_config_change"

    # -----------------------------------------------------------------------
    # Rule 4: CPU high threshold exceeded
    # -----------------------------------------------------------------------
    - name: IOS - CPU threshold exceeded
      condition: >
        event.message is match(".*%SYS-3-CPUHOG.*", ignorecase=true)
        or
        event.message is match(".*%SYS-4-P2_WARN.*", ignorecase=true)
      action:
        run_playbook:
          name: playbooks/collect_diag.yml
          extra_vars:
            syslog_host: "{{ event.host }}"
            syslog_message: "{{ event.message }}"
            trigger_source: "syslog_cpu_high"
