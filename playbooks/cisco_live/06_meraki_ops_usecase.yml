---
# Phase 6 — Validated content use case: network.meraki_ops only (no direct cisco.meraki tasks)
#
# Mirrors collection playbooks/reports_devices.yaml — device inventory report via
# report role + report_view filter plugin.
#
# Requires: MERAKI_API_KEY (or meraki_api_key), meraki_org_id in group_vars/meraki.yml
#           GITHUB_TOKEN for ansible.scm git_publish (override scm_origin_url if needed)
#
# Run:
#   ansible-playbook playbooks/cisco_live/06_meraki_ops_usecase.yml \
#     -i inventory/cisco_live_hosts.yml

- name: "Cisco Live Phase 6 — meraki_ops device report (validated content)"
  hosts: localhost
  gather_facts: true

  vars:
    meraki_report_category: all
    # Set org id (Dashboard: Organization > Settings > Organization ID)
    meraki_org_id: "828099381482762270"
    # API key from env; cisco.meraki modules also accept MERAKI_DASHBOARD_API_KEY
    meraki_api_key: "{{ lookup('env', 'MERAKI_DASHBOARD_API_KEY') | default(lookup('env', 'MERAKI_API_KEY'), true) }}"
    meraki_report_local_path: "{{ playbook_dir }}/report_data_file.yaml"
    # Override with -e scm_origin_url=... or set in inventory/group_vars
    scm_origin_url: "https://github.com/KB-perByte/clus_reports"
    scm_upstream_url: "https://github.com/KB-perByte/clus_reports"
    scm_upstream_branch: master
    scm_git_token: "{{ lookup('env', 'GITHUB_TOKEN') | default('', true) }}"
    meraki_report_repo_subpath: "reports/meraki_org_{{ meraki_org_id }}_report.yaml"

  roles:
    - role: network.meraki_ops.report
      category: "{{ meraki_report_category }}"

  tasks:
    - name: Validate meraki_ops report output
      ansible.builtin.assert:
        that:
          - my_org_report_data is defined
          - my_org_report_data.devices_report is defined
          - my_org_report_data.devices_report | length > 0
        fail_msg: >-
          network.meraki_ops.report did not produce devices_report data.
          Check API key scope and meraki_org_id.
        success_msg: >-
          meraki_ops report: {{ my_org_report_data.devices_report | length }} device(s) in org {{ meraki_org_id }}.

    - name: Show device inventory summary from report_view filter
      ansible.builtin.debug:
        msg:
          report_category: "{{ meraki_report_category }}"
          devices: "{{ my_org_report_data.devices_report.values() | map(attribute='name') | list }}"

    - name: Note artifact path (written by the report role on the execution node)
      ansible.builtin.debug:
        msg: "Full YAML dump: {{ meraki_report_local_path }}"

    - name: Retrieve GitHub repository for report publish
      ansible.scm.git_retrieve:
        origin:
          url: "{{ scm_origin_url }}"
          token: "{{ scm_git_token | default(omit) }}"
        upstream: "{{ {'url': scm_upstream_url, 'branch': scm_upstream_branch} if scm_upstream_url else omit }}"
      register: meraki_report_repository

    - name: Copy Meraki report into the retrieved repository
      ansible.builtin.copy:
        src: "{{ meraki_report_local_path }}"
        dest: "{{ meraki_report_repository.path }}/{{ meraki_report_repo_subpath }}"
        mode: "0644"

    - name: Publish Meraki report to GitHub
      ansible.scm.git_publish:
        path: "{{ meraki_report_repository.path }}"
        token: "{{ scm_git_token | default(omit) }}"
        include:
          - "{{ meraki_report_repo_subpath }}"
        commit:
          message: >-
            Meraki device report for org {{ meraki_org_id }}
            (category: {{ meraki_report_category }}, {{ ansible_date_time.iso8601 }})
      register: meraki_report_publish

    - name: Show GitHub publish result
      ansible.builtin.debug:
        msg:
          local_report: "{{ meraki_report_local_path }}"
          repo_path: "{{ meraki_report_repository.path }}"
          branch: "{{ meraki_report_repository.branch_name }}"
          repo_file: "{{ meraki_report_repo_subpath }}"
          publish: "{{ meraki_report_publish.msg }}"
