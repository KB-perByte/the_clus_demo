---
# Playbook: remediate_nxos_interface.yml
#
# Purpose: Auto-remediate a downed NXOS interface triggered by EDA syslog event
# Called by: cisco_syslog_rulebook.yml

- name: NXOS interface auto-remediation
  hosts: "{{ syslog_host | default('cisco_nxos') }}"
  gather_facts: false

  vars:
    interface_name: "{{ syslog_message | regex_search('Interface (\\S+)', '\\1') | first | default('unknown') }}"
    ts: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}"

  tasks:

    - name: Get interface status
      cisco.nxos.nxos_command:
        commands:
          - "show interface {{ interface_name }} brief"
          - "show interface {{ interface_name }}"
      register: intf_status

    - name: Parse interface state
      ansible.builtin.set_fact:
        is_admin_down: "{{ 'Administratively down' in intf_status.stdout[0] }}"
        is_link_down: "{{ 'sfpAbsent' in intf_status.stdout[1] or 'xcvrAbsent' in intf_status.stdout[1] }}"

    - name: Skip admin-down interfaces
      ansible.builtin.meta: end_host
      when: is_admin_down | bool

    - name: Bounce interface - shutdown
      cisco.nxos.nxos_config:
        lines:
          - "shutdown"
        parents: "interface {{ interface_name }}"
      when: not is_admin_down | bool and not is_link_down | bool

    - name: Wait before no-shutdown
      ansible.builtin.pause:
        seconds: 5
      when: not is_admin_down | bool and not is_link_down | bool

    - name: Bounce interface - no shutdown
      cisco.nxos.nxos_config:
        lines:
          - "no shutdown"
        parents: "interface {{ interface_name }}"
      when: not is_admin_down | bool and not is_link_down | bool
      register: bounce_result

    - name: Verify recovery
      cisco.nxos.nxos_command:
        commands:
          - "show interface {{ interface_name }} brief"
        wait_for:
          - "result[0] contains 'connected'"
        retries: 6
        interval: 5
      register: recovery_check
      ignore_errors: true
      when: bounce_result is defined

    - name: Save config
      cisco.nxos.nxos_command:
        commands:
          - "copy running-config startup-config"
      when:
        - bounce_result is defined
        - not recovery_check.failed | default(true)

    - name: Notify outcome
      ansible.builtin.uri:
        url: "{{ notify_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: >
            {{ '✅ *NXOS Auto-remediation SUCCESS*' if not recovery_check.failed | default(true) else '🔴 *NXOS Remediation FAILED*' }}
            | `{{ inventory_hostname }}` Interface `{{ interface_name }}` | {{ ts }}
      when: notify_webhook_url is defined
      ignore_errors: true
