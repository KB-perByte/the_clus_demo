---
# Playbook: remediate_ios_interface.yml
#
# Purpose: Auto-remediate a downed IOS interface triggered by EDA syslog event
# Called by: cisco_syslog_rulebook.yml
#
# What it does:
#   1. Parses syslog to identify which interface went down
#   2. Checks current interface state
#   3. If physically down: logs and notifies (hardware issue — do not auto-bounce)
#   4. If line-protocol down only: restarts interface (shutdown → no shutdown)
#   5. Verifies recovery and sends notification

- name: IOS interface auto-remediation
  hosts: ios
  gather_facts: false

  vars:
    # Parsed from syslog message passed in via EDA extra_vars
    # Example message: "%LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down"
    interface_name: "{{ syslog_message | regex_search('Interface (\\S+),', '\\1') | first | default('unknown') }}"
    remediation_timestamp: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}"

  tasks:

    - name: Log event receipt
      ansible.builtin.debug:
        msg: >
          EDA triggered remediation | host={{ inventory_hostname }}
          | interface={{ interface_name }}
          | message={{ syslog_message }}
          | timestamp={{ remediation_timestamp }}

    # ------------------------------------------------------------------
    # Check current interface state before taking any action
    # ------------------------------------------------------------------
    - name: Get current interface status
      cisco.ios.ios_command:
        commands:
          - "show interfaces {{ interface_name }}"
          - "show interfaces {{ interface_name }} status"
      register: intf_status

    - name: Parse interface state
      ansible.builtin.set_fact:
        is_line_down: "{{ 'line protocol is down' in intf_status.stdout[0] }}"
        is_link_down: "{{ 'GigabitEthernet' in intf_status.stdout[0] and 'is down' in intf_status.stdout[0].split('\n')[0] }}"
        is_admin_down: "{{ 'administratively down' in intf_status.stdout[0] }}"

    - name: Log interface state analysis
      ansible.builtin.debug:
        msg:
          - "Interface: {{ interface_name }}"
          - "Link down: {{ is_link_down }}"
          - "Line protocol down: {{ is_line_down }}"
          - "Admin down (do not touch): {{ is_admin_down }}"

    # ------------------------------------------------------------------
    # Abort if admin-down — this was intentional, do not override
    # ------------------------------------------------------------------
    - name: Skip if interface is admin-down (intentional shutdown)
      ansible.builtin.meta: end_host
      when: is_admin_down | bool

    # ------------------------------------------------------------------
    # If only line protocol is down, bounce the interface
    # (Physical link is present but protocol flapped — safe to bounce)
    # ------------------------------------------------------------------
    - name: Bounce interface - shutdown
      cisco.ios.ios_config:
        lines:
          - "shutdown"
        parents: "interface {{ interface_name }}"
      when:
        - is_line_down | bool
        - not is_link_down | bool

    - name: Wait briefly before re-enabling
      ansible.builtin.pause:
        seconds: 5
      when:
        - is_line_down | bool
        - not is_link_down | bool

    - name: Bounce interface - no shutdown
      cisco.ios.ios_config:
        lines:
          - "no shutdown"
        parents: "interface {{ interface_name }}"
      when:
        - is_line_down | bool
        - not is_link_down | bool
      register: bounce_result

    # ------------------------------------------------------------------
    # Verify recovery after bounce
    # ------------------------------------------------------------------
    - name: Wait for interface to come up
      cisco.ios.ios_command:
        commands:
          - "show interfaces {{ interface_name }}"
        wait_for:
          - "result[0] contains 'line protocol is up'"
        retries: 6
        interval: 5
      when:
        - is_line_down | bool
        - not is_link_down | bool
      register: recovery_check
      ignore_errors: true

    - name: Set recovery status
      ansible.builtin.set_fact:
        recovery_success: "{{ recovery_check.failed is defined and not recovery_check.failed }}"
      when: bounce_result is defined

    # ------------------------------------------------------------------
    # Collect diagnostics for physical link failures
    # ------------------------------------------------------------------
    - name: Collect diagnostics for physical link failure
      cisco.ios.ios_command:
        commands:
          - "show interfaces {{ interface_name }} counters errors"
          - "show logging last 20"
          - "show cdp neighbors {{ interface_name }} detail"
      register: diag_output
      when: is_link_down | bool
      ignore_errors: true

    # ------------------------------------------------------------------
    # Save configuration if interface was recovered
    # ------------------------------------------------------------------
    - name: Save running config after recovery
      cisco.ios.ios_command:
        commands:
          - "write memory"
      when:
        - bounce_result is defined
        - recovery_success | default(false) | bool

    # ------------------------------------------------------------------
    # Send Slack notification
    # ------------------------------------------------------------------
    - name: Notify - interface recovered
      ansible.builtin.uri:
        url: "{{ notify_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: >
            ✅ *Auto-remediation SUCCESS* | `{{ inventory_hostname }}`
            Interface `{{ interface_name }}` bounced and recovered at {{ remediation_timestamp }}.
            Triggered by EDA syslog event.
      when:
        - notify_webhook_url is defined
        - bounce_result is defined
        - recovery_success | default(false) | bool
      ignore_errors: true

    - name: Notify - physical link failure (needs manual attention)
      ansible.builtin.uri:
        url: "{{ notify_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: >
            🔴 *Manual intervention needed* | `{{ inventory_hostname }}`
            Interface `{{ interface_name }}` has a *physical link failure* — EDA detected but will NOT auto-bounce.
            Timestamp: {{ remediation_timestamp }}
      when:
        - notify_webhook_url is defined
        - is_link_down | bool
      ignore_errors: true
