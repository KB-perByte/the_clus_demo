---
# Playbook: compliance_check.yml
#
# Purpose: Run a basic compliance audit across IOS/NXOS devices
# Called by: cisco_webhook_rulebook.yml or manually

- name: Cisco network compliance check
  hosts: "{{ target_group | default('all') }}"
  gather_facts: false

  vars:
    ts: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}"
    report_file: "/opt/ansible/reports/compliance_{{ ts }}.txt"
    required_ntp_server: "10.0.0.1"
    required_logging_host: "10.0.0.5"
    required_banner: "AUTHORIZED ACCESS ONLY"

  tasks:

    # IOS compliance checks
    - name: IOS - Gather compliance facts
      cisco.ios.ios_command:
        commands:
          - "show ntp status"
          - "show logging"
          - "show banner motd"
          - "show running-config | include aaa"
          - "show running-config | include service password"
      register: ios_compliance
      when: ansible_network_os == "cisco.ios.ios"

    - name: IOS - Evaluate NTP compliance
      ansible.builtin.set_fact:
        ntp_compliant: "{{ required_ntp_server in ios_compliance.stdout[0] }}"
        logging_compliant: "{{ required_logging_host in ios_compliance.stdout[1] }}"
        banner_compliant: "{{ required_banner in ios_compliance.stdout[2] }}"
        aaa_enabled: "{{ 'aaa new-model' in ios_compliance.stdout[3] }}"
        password_encrypted: "{{ 'service password-encryption' in ios_compliance.stdout[4] }}"
      when: ansible_network_os == "cisco.ios.ios"

    # NXOS compliance checks
    - name: NXOS - Gather compliance facts
      cisco.nxos.nxos_command:
        commands:
          - "show ntp peer-status"
          - "show logging server"
          - "show running-config | include banner"
          - "show running-config | include aaa"
      register: nxos_compliance
      when: ansible_network_os == "cisco.nxos.nxos"

    - name: NXOS - Evaluate compliance
      ansible.builtin.set_fact:
        ntp_compliant: "{{ required_ntp_server in nxos_compliance.stdout[0] }}"
        logging_compliant: "{{ required_logging_host in nxos_compliance.stdout[1] }}"
        banner_compliant: "{{ required_banner in nxos_compliance.stdout[2] }}"
        aaa_enabled: "{{ 'aaa' in nxos_compliance.stdout[3] }}"
        password_encrypted: true
      when: ansible_network_os == "cisco.nxos.nxos"

    - name: Compliance summary per device
      ansible.builtin.debug:
        msg:
          - "=== COMPLIANCE REPORT: {{ inventory_hostname }} ==="
          - "NTP server ({{ required_ntp_server }}):   {{ '✅ PASS' if ntp_compliant else '❌ FAIL' }}"
          - "Logging ({{ required_logging_host }}): {{ '✅ PASS' if logging_compliant else '❌ FAIL' }}"
          - "Banner configured:                   {{ '✅ PASS' if banner_compliant else '❌ FAIL' }}"
          - "AAA new-model:                       {{ '✅ PASS' if aaa_enabled else '❌ FAIL' }}"
          - "Password encryption:                 {{ '✅ PASS' if password_encrypted else '❌ FAIL' }}"

    - name: Flag non-compliant devices
      ansible.builtin.set_fact:
        is_compliant: >-
          {{
            ntp_compliant | bool and
            logging_compliant | bool and
            banner_compliant | bool and
            aaa_enabled | bool and
            password_encrypted | bool
          }}

    - name: Notify non-compliant devices
      ansible.builtin.uri:
        url: "{{ notify_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: >
            ⚠️ *Compliance FAIL* | `{{ inventory_hostname }}` at {{ ts }}
            NTP={{ ntp_compliant }}, Logging={{ logging_compliant }},
            Banner={{ banner_compliant }}, AAA={{ aaa_enabled }}, PwdEnc={{ password_encrypted }}
      when:
        - not is_compliant | bool
        - notify_webhook_url is defined
      ignore_errors: true
