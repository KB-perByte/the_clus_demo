---
# Playbook: backup_config.yml
#
# Purpose: Backup running config when EDA detects a config change syslog
# Called by: cisco_syslog_rulebook.yml (rule: "Config change detected")
#
# What it does:
#   1. Pulls running-config from IOS or NXOS device
#   2. Saves to timestamped file in backup_root directory
#   3. Diffs against the last known-good backup
#   4. Sends diff notification to Slack/webhook

- name: Config backup and diff on change event
  hosts: ios
  gather_facts: false

  vars:
    ts: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    device_backup_dir: "{{ backup_root }}/{{ inventory_hostname }}"
    backup_file: "{{ device_backup_dir }}/running_config_{{ ts }}.txt"
    latest_link: "{{ device_backup_dir }}/latest.txt"

  tasks:

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ device_backup_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost

    # ------------------------------------------------------------------
    # Backup IOS devices
    # ------------------------------------------------------------------
    - name: IOS - fetch running config
      cisco.ios.ios_command:
        commands:
          - "show running-config"
      register: ios_config_output
      when: ansible_network_os == "cisco.ios.ios"

    - name: IOS - write config to file
      ansible.builtin.copy:
        content: "{{ ios_config_output.stdout[0] }}"
        dest: "{{ backup_file }}"
        mode: "0640"
      delegate_to: localhost
      when: ansible_network_os == "cisco.ios.ios"

    # ------------------------------------------------------------------
    # Backup NXOS devices
    # ------------------------------------------------------------------
    - name: NXOS - fetch running config
      cisco.nxos.nxos_command:
        commands:
          - "show running-config"
      register: nxos_config_output
      when: ansible_network_os == "cisco.nxos.nxos"

    - name: NXOS - write config to file
      ansible.builtin.copy:
        content: "{{ nxos_config_output.stdout[0] }}"
        dest: "{{ backup_file }}"
        mode: "0640"
      delegate_to: localhost
      when: ansible_network_os == "cisco.nxos.nxos"

    # ------------------------------------------------------------------
    # Diff against previous backup
    # ------------------------------------------------------------------
    - name: Check if previous backup exists
      ansible.builtin.stat:
        path: "{{ latest_link }}"
      register: latest_stat
      delegate_to: localhost

    - name: Generate diff against last backup
      ansible.builtin.command:
        cmd: "diff {{ latest_link }} {{ backup_file }}"
      register: config_diff
      changed_when: config_diff.rc == 1
      failed_when: config_diff.rc > 1
      delegate_to: localhost
      when: latest_stat.stat.exists

    - name: Set diff summary
      ansible.builtin.set_fact:
        diff_lines: "{{ config_diff.stdout_lines | length }}"
        diff_preview: "{{ config_diff.stdout_lines[:20] | join('\n') | default('No diff available') }}"
      when: config_diff is defined and config_diff.stdout_lines is defined

    # ------------------------------------------------------------------
    # Update the 'latest' symlink/copy
    # ------------------------------------------------------------------
    - name: Copy current backup as new 'latest'
      ansible.builtin.copy:
        src: "{{ backup_file }}"
        dest: "{{ latest_link }}"
        remote_src: false
        mode: "0640"
      delegate_to: localhost

    # ------------------------------------------------------------------
    # Notify with diff summary
    # ------------------------------------------------------------------
    - name: Notify - config change with diff
      ansible.builtin.uri:
        url: "{{ notify_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: |
            📋 *Config change detected* | `{{ inventory_hostname }}`
            Triggered by: `{{ syslog_message | default('EDA event') }}`
            Backup saved: `{{ backup_file }}`
            Lines changed: {{ diff_lines | default('N/A (first backup)') }}
            ```
            {{ diff_preview | default('First backup — no previous config to diff') }}
            ```
      when: notify_webhook_url is defined
      ignore_errors: true

    - name: Show summary
      ansible.builtin.debug:
        msg:
          - "Backup saved: {{ backup_file }}"
          - "Config diff lines: {{ diff_lines | default('First backup') }}"
