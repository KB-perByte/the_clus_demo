---
# Playbook: collect_diag.yml
#
# Purpose: Collect show commands for CPU/memory events
# Called by: cisco_syslog_rulebook.yml (rule: CPU threshold exceeded)

- name: Collect diagnostics on CPU/memory event
  hosts: ios
  gather_facts: false

  vars:
    ts: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}"
    diag_dir: "/opt/ansible/diagnostics/{{ inventory_hostname }}"
    diag_file: "{{ diag_dir }}/diag_{{ ts }}.txt"

  tasks:

    - name: Ensure diag directory exists
      ansible.builtin.file:
        path: "{{ diag_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost

    - name: IOS - Collect diagnostic show commands
      cisco.ios.ios_command:
        commands:
          - "show processes cpu sorted | head 20"
          - "show processes memory sorted | head 20"
          - "show version"
          - "show logging last 50"
          - "show interface summary"
      register: ios_diag
      when: ansible_network_os == "cisco.ios.ios"
      ignore_errors: true

    - name: NXOS - Collect diagnostic show commands
      cisco.nxos.nxos_command:
        commands:
          - "show processes cpu sort | head 20"
          - "show processes memory sort | head 20"
          - "show version"
          - "show logging last 50"
          - "show interface brief"
      register: nxos_diag
      when: ansible_network_os == "cisco.nxos.nxos"
      ignore_errors: true

    - name: Save diagnostics to file
      ansible.builtin.copy:
        content: |
          === DIAGNOSTIC COLLECTION ===
          Host: {{ inventory_hostname }}
          Timestamp: {{ ts }}
          Trigger: {{ syslog_message | default('manual') }}
          =============================

          {{ (ios_diag.stdout | default(nxos_diag.stdout | default([]))) | join('\n\n--- NEXT COMMAND ---\n\n') }}
        dest: "{{ diag_file }}"
        mode: "0640"
      delegate_to: localhost

    - name: Notify - diagnostics collected
      ansible.builtin.uri:
        url: "{{ notify_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: >
            🔍 *Diagnostics collected* | `{{ inventory_hostname }}`
            Trigger: `{{ syslog_message | default('manual') }}`
            Saved to: `{{ diag_file }}`
      when: notify_webhook_url is defined
      ignore_errors: true
